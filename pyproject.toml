[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "powfacpy"
version = "0.5.0"

authors = [
  { name="Sciemon", email="simon.eberlein@gmx.de" },
]
description = "PowerFactory wrapper"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
    "pandas >= 2.0",
    "matplotlib >= 3.5",
    "aenum >= 3.0",
]

[project.optional-dependencies]
# powfacpy.applications.pandapower_interface (PandapowerInterface)
pandapower = [
    "pandapower >= 3.2",
]
# powfacpy.applications.plots (Plots.plot_from_pandas_using_comtrade only)
comtrade = [
    "comtraderecord >= 1.0.2",
]
# powfacpy.applications.dynamic_model_docs (DynamicModelDocs)
docs = [
    "markdown >= 3.0",
]
# powfacpy.applications.parameter_studies (pf_parameter / apply_gradient - built
# on the backend-agnostic https://github.com/FraunhIEE-UniKassel-PowSysStability/parstudy)
parstudy = [
    "parstudy >= 0.2.0",
]
# powfacpy.applications.dynamic_modal_analysis (ModalAnalysis - eigenvalues,
# damping ratios and participation factors from PowerFactory's ComMod).
# Eigenvalue sweeps additionally need the 'parstudy' extra above.
dynamic_modal_analysis = [
    "scipy >= 1.10",
    # pandas Styler (the show() tables) needs jinja2
    "jinja2 >= 3.0",
]
tutorials = [
    "jupyter>=1.1.1",
    "PyQt6>= 6.1.0",
    "deepdiff >= 8.6.2",
]
# test / development dependencies
dev = [
    "pytest >= 8.0",
    "pytest-cov >= 5.0",
    "ruff >= 0.6",
]
# everything above, for a full-featured install
all = [
    "powfacpy[pandapower,comtrade,docs,parstudy,dynamic_modal_analysis,tutorials,dev]",
]

[project.urls]
"Homepage" = "https://github.com/FraunhIEE-UniKassel-PowSysStability/powfacpy"
"Bug Tracker" = "https://github.com/FraunhIEE-UniKassel-PowSysStability/powfacpy/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true
markers = [
    "unit: pure-Python test - runs without a PowerFactory installation or license",
]
# Most tests need a live PowerFactory (a license and 'powerfactory' on sys.path).
# Run only the fast ones with:  pytest -m unit
# Coverage of the meaningful modules (protocols.py / result_variables.py are
# generated and dominate the statement count, so they are excluded):
#   pytest --cov=src/powfacpy --cov-report=term-missing \
#     --cov-config=pyproject.toml
[tool.coverage.run]
source = ["src/powfacpy"]
omit = [
    "src/powfacpy/pf_classes/protocols.py",
    "src/powfacpy/result_variables.py",
    "src/powfacpy/pf_class_protocols.py",
]

[tool.ruff]
# Only lint the package and its tests. The two big generated modules and the
# generated test output are excluded.
include = ["src/**/*.py", "tests/**/*.py"]
extend-exclude = [
    "src/powfacpy/pf_classes/protocols.py",
    "src/powfacpy/result_variables.py",
    "tests/tests_output",
    "tests/tests_input",
]
target-version = "py311"

[tool.ruff.lint]
# Conservative baseline: syntax errors, pyflakes (unused/undefined names) and the
# pycodestyle checks that flag likely bugs. Formatting is not enforced yet.
select = ["E4", "E7", "E9", "F"]
ignore = [
    # Deliberate late imports (circular-import avoidance, sys.path set-up in tests).
    "E402",
    # PowerFactory attributes can be None/0/1, so '== False' is not always 'not x'.
    "E712",
]

[tool.ruff.lint.per-file-ignores]
# Fixtures imported from another test module and requested by name in the test
# signature look like redefinitions to pyflakes.
"tests/**" = ["F811"]
